<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>SWS Klussenbedrijf</title>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#f2f4f7;margin:0;color:#17202a}
header{background:#111827;color:#fff;padding:18px 15px}.wrap{max-width:680px;margin:auto;padding:15px}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
h1{font-size:22px;margin:0}h2{margin:0 0 12px;font-size:19px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
input,select,button,textarea{width:100%;min-height:48px;border-radius:12px;border:1px solid #d5d9df;font-size:16px;padding:10px 12px;background:#fff}
textarea{min-height:80px;resize:vertical}button{background:#111827;color:#fff;border:0;font-weight:700;margin-top:12px}
.secondary{background:#e8ebef;color:#111827}.danger{background:#fee2e2;color:#991b1b}.small{width:auto;min-height:38px;padding:0 12px;margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#f7f8fa;padding:13px;border-radius:14px}.num{font-size:23px;font-weight:800}.muted{color:#6b7280;font-size:12px}
.entry{border:1px solid #e1e4e8;border-radius:14px;padding:12px;margin-top:10px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.hours{font-weight:800}.hidden{display:none}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.tab{background:#e8ebef;color:#111827;margin:0;min-height:44px;padding:5px;font-size:13px}.tab.active{background:#111827;color:#fff}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:12px}
.total{font-size:18px;font-weight:800}.notice{background:#fff7ed;border-radius:12px;padding:10px;font-size:13px;color:#9a3412;margin-top:10px}
</style>
</head>
<body>
<header><div class="wrap"><h1>SWS Klussenbedrijf</h1><div style="opacity:.75">Учёт часов · закупок · расходов</div></div></header>
<div class="wrap">

<section class="card" id="login">
  <h2>Вход</h2>
  <label>Работник</label>
  <select id="worker"><option value="Стас">Стас</option><option value="Юра">Юра</option><option value="Артур">Артур</option></select>
  <label>Пароль работника</label>
  <input id="workerPassword" type="password" placeholder="Введите свой пароль">
  <button onclick="loginWorker()">Войти как работник</button>
  <button class="secondary" onclick="showAdminLogin()">Войти как администратор</button>
  <div id="adminLoginBox" class="hidden">
    <label>Пароль администратора</label>
    <input id="adminPassword" type="password" placeholder="Для теста: 1234">
    <button onclick="loginAdmin()">Войти</button>
  </div>
</section>

<div id="app" class="hidden">
  <div class="card">
    <div class="row"><div><h2 id="hello"></h2><span class="badge" id="roleBadge"></span></div><button class="secondary small" onclick="logout()">Выйти</button></div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabHours" onclick="openTab('hours')">Часы</button>
    <button class="tab" id="tabPurchases" onclick="openTab('purchases')">Закупки</button>
    <button class="tab" id="tabExpenses" onclick="openTab('expenses')">Расходы</button>
    <button class="tab hidden" id="tabUsers" onclick="openTab('users')">Пользователи</button>
  </div>

  <section class="card page" id="pageHours">
    <h2>Добавить рабочий день</h2>
    <label>Работник</label>
    <select id="hoursWorker"></select>
    <label>Дата</label><input type="date" id="date">
    <label>Место работы</label><input id="place" placeholder="Например: Amsterdam, Keizersgracht 20">
    <button type="button" class="secondary" onclick="getLocation()">📍 Определить моё местоположение</button>
    <div id="locationStatus" class="muted" style="margin-top:7px"></div>
    <div class="grid">
      <div><label>Начало</label><input type="time" id="start"></div>
      <div><label>Конец</label><input type="time" id="end"></div>
    </div>
    <label>Перерыв, минут</label><input type="number" id="break" value="30" min="0">
    <button onclick="saveDay()">Сохранить рабочий день</button>
    <h2 style="margin-top:20px">Записи</h2>
    <div class="stats"><div class="stat"><div class="muted">Рабочих дней</div><div class="num" id="days">0</div></div><div class="stat"><div class="muted">Всего часов</div><div class="num" id="total">0</div></div></div>
    <div id="entries"></div>
  </section>

  <section class="card page hidden" id="pagePurchases">
    <h2>🛒 Закупка материала</h2>
    <div class="notice">На этой тестовой версии закупки сохраняются в браузере. Позже подключим Airtable, чтобы все телефоны видели одну общую базу.</div>
    <label>Кто закупил</label><select id="purchaseWorker"></select>
    <label>Дата</label><input type="date" id="purchaseDate">
    <label>Что купили</label><input id="purchaseItem" placeholder="Например: лак, кисти, дерево">
    <div class="grid">
      <div><label>Количество</label><input type="number" id="purchaseQty" min="0" step="0.01" value="1"></div>
      <div><label>Цена, €</label><input type="number" id="purchasePrice" min="0" step="0.01" placeholder="0.00"></div>
    </div>
    <label>Магазин / поставщик</label><input id="purchaseStore" placeholder="Например: Praxis">
    <label>Комментарий</label><textarea id="purchaseNote" placeholder="Для какого объекта или что важно"></textarea>
    <button onclick="savePurchase()">Сохранить закупку</button>
    <div id="purchaseList"></div>
  </section>

  <section class="card page hidden" id="pageExpenses">
    <h2>💶 Расход</h2>
    <label>Кто внёс расход</label><select id="expenseWorker"></select>
    <label>Дата</label><input type="date" id="expenseDate">
    <label>Категория</label>
    <select id="expenseCategory"><option>Транспорт</option><option>Инструмент</option><option>Материал</option><option>Топливо</option><option>Другое</option></select>
    <label>Описание</label><input id="expenseItem" placeholder="Например: парковка">
    <label>Сумма, €</label><input type="number" id="expenseAmount" min="0" step="0.01" placeholder="0.00">
    <label>Комментарий</label><textarea id="expenseNote"></textarea>
    <label>Фото чека</label><input id="expenseReceipt" type="file" accept="image/*" capture="environment"><div id="receiptPreview" class="muted" style="margin-top:7px"></div>
    <button onclick="saveExpense()">Сохранить расход</button>
    <div id="expenseList"></div>
  </section>

  <section class="card page hidden" id="pageUsers">
    <h2>👥 Пользователи</h2>
    <label>Имя нового работника</label><input id="newWorker" placeholder="Например: Андрей">
    <label>Пароль нового работника</label><input id="newWorkerPassword" type="password" placeholder="Минимум 4 символа">
    <button onclick="addWorker()">Добавить работника</button>
    <div id="userList"></div>
  </section>
</div>
</div>

<script>
const KEY_HOURS="sws_hours_test_v3", KEY_PURCHASES="sws_purchases_test_v1", KEY_EXPENSES="sws_expenses_test_v1", KEY_USERS="sws_users_test_v1";
let users=JSON.parse(localStorage.getItem(KEY_USERS)||'[{"name":"Стас","password":"1111"},{"name":"Юра","password":"2222"},{"name":"Артур","password":"3333"}]');
if(!Array.isArray(users)||!users.length||typeof users[0]==="string"||!users[0].name){
  users=[{"name":"Стас","password":"1111"},{"name":"Юра","password":"2222"},{"name":"Артур","password":"3333"}];
  localStorage.setItem(KEY_USERS,JSON.stringify(users));
}
let current="", role="";
const $=id=>document.getElementById(id);
const today=new Date().toISOString().slice(0,10);
$("date").value=today;$("purchaseDate").value=today;$("expenseDate").value=today;

function saveUsers(){localStorage.setItem(KEY_USERS,JSON.stringify(users))}
function get(key){return JSON.parse(localStorage.getItem(key)||"[]")}
function put(key,data){localStorage.setItem(key,JSON.stringify(data))}
function safe(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function fillWorkers(){
  ["worker","hoursWorker","purchaseWorker","expenseWorker"].forEach(id=>{
    const el=$(id); const old=el.value;
    el.innerHTML=users.map(u=>`<option>${safe(u.name)}</option>`).join("");
    if(users.some(u=>u.name===old)) el.value=old;
  });
}
function loginWorker(){
  const name=$("worker").value, pass=$("workerPassword").value;
  const u=users.find(x=>x.name===name);
  if(!u || pass!==u.password){alert("Неверный пароль.");return}
  current=name; role="worker"; enter();
}
function showAdminLogin(){$("adminLoginBox").classList.remove("hidden")}
function loginAdmin(){
  if($("adminPassword").value!=="1234"){alert("Неверный пароль. Тестовый пароль: 1234");return}
  current="Администратор";role="admin";enter();
}
function enter(){
  fillWorkers();$("hoursWorker").value=role==="worker"?current:users[0].name;
  $("purchaseWorker").value=role==="worker"?current:users[0].name;
  $("expenseWorker").value=role==="worker"?current:users[0].name;
  $("login").classList.add("hidden");$("app").classList.remove("hidden");
  $("hello").textContent="Привет, "+current+"!";
  $("roleBadge").textContent=role==="admin"?"Администратор":"Работник";
  $("workerPassword").value="";
  $("tabUsers").classList.toggle("hidden",role!=="admin");
  openTab("hours");
}
function logout(){current="";role="";$("app").classList.add("hidden");$("login").classList.remove("hidden");$("adminLoginBox").classList.add("hidden");$("adminPassword").value=""}

function openTab(tab){
  ["hours","purchases","expenses","users"].forEach(x=>{
    $("page"+x[0].toUpperCase()+x.slice(1)).classList.toggle("hidden",x!==tab);
    const t=$("tab"+x[0].toUpperCase()+x.slice(1)); if(t)t.classList.toggle("active",x===tab);
  });
  if(tab==="hours")renderHours(); if(tab==="purchases")renderPurchases(); if(tab==="expenses")renderExpenses(); if(tab==="users")renderUsers();
}

let currentLocation=null;

function getLocation(){
  if(!navigator.geolocation){alert("Геолокация не поддерживается этим браузером.");return}
  $("locationStatus").textContent="Определяем местоположение…";
  navigator.geolocation.getCurrentPosition(pos=>{
    currentLocation={lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy:Math.round(pos.coords.accuracy)};
    $("locationStatus").textContent="📍 Местоположение получено (точность около "+currentLocation.accuracy+" м)";
  },err=>{
    $("locationStatus").textContent="";
    alert("Не удалось получить геолокацию. Разреши доступ к местоположению для этого сайта.");
  },{enableHighAccuracy:true,timeout:10000,maximumAge:60000});
}

function saveDay(){
  let worker=$("hoursWorker").value,date=$("date").value,place=$("place").value.trim(),start=$("start").value,end=$("end").value,br=Number($("break").value||0);
  if(!date||!place||!start||!end){alert("Заполни дату, место, начало и конец работы.");return}
  let a=new Date("2000-01-01T"+start),b=new Date("2000-01-01T"+end);if(b<=a)b.setDate(b.getDate()+1);
  let hours=Math.max(0,(b-a)/3600000-br/60);
  const save=(loc=null)=>{
    let data=get(KEY_HOURS);
    data.push({id:Date.now(),worker,date,place,start,end,br,hours,location:loc});
    put(KEY_HOURS,data);
    $("place").value="";$("start").value="";$("end").value="";$("locationStatus").textContent="";currentLocation=null;
    renderHours();alert("Сохранено: "+hours.toFixed(2)+" часа"+(loc?"\nГеолокация сохранена.":"\nГеолокация не получена."));
  };
  if(navigator.geolocation){
    $("locationStatus").textContent="📍 Получаем геолокацию…";
    navigator.geolocation.getCurrentPosition(pos=>{
      const loc={lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy:Math.round(pos.coords.accuracy)};
      save(loc);
    },()=>{
      if(confirm("Не удалось получить геолокацию. Сохранить рабочий день без неё?")) save(null);
      else $("locationStatus").textContent="";
    },{enableHighAccuracy:true,timeout:10000,maximumAge:60000});
  }else save(null);
}
function renderHours(){
  let data=get(KEY_HOURS),a=role==="admin"?data:data.filter(x=>x.worker===current);
  a.sort((x,y)=>y.date.localeCompare(x.date));
  $("days").textContent=a.length;$("total").textContent=a.reduce((s,x)=>s+x.hours,0).toFixed(2);
  $("entries").innerHTML=a.length?a.map(x=>`<div class="entry"><div class="row"><b>${safe(x.date)} · ${safe(x.worker)}</b><span class="hours">${x.hours.toFixed(2)} ч</span></div><div>${safe(x.place)}</div><div class="muted">${safe(x.start)}–${safe(x.end)} · перерыв ${x.br} мин</div>
  ${x.location?`<div style="margin-top:6px"><a href="https://www.google.com/maps?q=${x.location.lat},${x.location.lon}" target="_blank">📍 Открыть место на карте</a></div>`:""}${role==="admin"||x.worker===current?`<button class="danger small" onclick="removeDay(${x.id})">Удалить</button>`:""}</div>`).join(""):"<p class='muted'>Записей пока нет.</p>";
}
function removeDay(id){if(!confirm("Удалить запись?"))return;put(KEY_HOURS,get(KEY_HOURS).filter(x=>x.id!==id));renderHours()}

function savePurchase(){
  let worker=$("purchaseWorker").value,date=$("purchaseDate").value,item=$("purchaseItem").value.trim(),qty=Number($("purchaseQty").value||0),price=Number($("purchasePrice").value||0),store=$("purchaseStore").value.trim(),note=$("purchaseNote").value.trim();
  if(!date||!item||price<=0){alert("Заполни дату, что купили и цену.");return}
  let d=get(KEY_PURCHASES);d.push({id:Date.now(),worker,date,item,qty,price,store,note,total:qty*price});put(KEY_PURCHASES,d);
  $("purchaseItem").value="";$("purchasePrice").value="";$("purchaseStore").value="";$("purchaseNote").value="";renderPurchases();alert("Закупка сохранена: €"+(qty*price).toFixed(2));
}
function renderPurchases(){
  let d=get(KEY_PURCHASES).sort((a,b)=>b.date.localeCompare(a.date)),total=d.reduce((s,x)=>s+x.total,0);
  $("purchaseList").innerHTML=`<div class="stat" style="margin-top:14px"><div class="muted">Всего закупок</div><div class="total">€${total.toFixed(2)}</div></div>`+(d.length?d.map(x=>`<div class="entry"><div class="row"><b>${safe(x.date)}</b><span class="total">€${x.total.toFixed(2)}</span></div><div><b>${safe(x.item)}</b> · ${safe(x.worker)}</div><div class="muted">${x.qty} шт. · €${x.price.toFixed(2)} / шт. ${x.store?"· "+safe(x.store):""}</div>${x.note?`<div>${safe(x.note)}</div>`:""}${x.receipt?`<div style="margin-top:8px"><a href="${x.receipt}" target="_blank">📷 Открыть чек</a></div>`:""}${role==="admin"||x.worker===current?`<button class="danger small" onclick="removePurchase(${x.id})">Удалить</button>`:""}</div>`).join(""):"<p class='muted'>Закупок пока нет.</p>");
}
function removePurchase(id){if(!confirm("Удалить закупку?"))return;put(KEY_PURCHASES,get(KEY_PURCHASES).filter(x=>x.id!==id));renderPurchases()}

function compressReceipt(file){
  return new Promise((resolve,reject)=>{
    if(!file){resolve(null);return}
    if(!file.type.startsWith("image/")){reject(new Error("Выбери фото чека."));return}
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement("canvas");c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        resolve(c.toDataURL("image/jpeg",0.78));
      };
      img.onerror=()=>reject(new Error("Не удалось прочитать фото."));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error("Не удалось прочитать фото."));
    reader.readAsDataURL(file);
  });
}
$("expenseReceipt").addEventListener("change",()=>{
  const f=$("expenseReceipt").files[0];
  $("receiptPreview").textContent=f?"📷 Чек выбран: "+f.name:"";
});
async function saveExpense(){
  let worker=$("expenseWorker").value,date=$("expenseDate").value,category=$("expenseCategory").value,item=$("expenseItem").value.trim(),amount=Number($("expenseAmount").value||0),note=$("expenseNote").value.trim();
  if(!date||!item||amount<=0){alert("Заполни дату, описание и сумму.");return}
  try{
    const receipt=await compressReceipt($("expenseReceipt").files[0]);
    let d=get(KEY_EXPENSES);d.push({id:Date.now(),worker,date,category,item,amount,note,receipt});put(KEY_EXPENSES,d);
    $("expenseItem").value="";$("expenseAmount").value="";$("expenseNote").value="";$("expenseReceipt").value="";$("receiptPreview").textContent="";
    renderExpenses();alert("Расход сохранён: €"+amount.toFixed(2));
  }catch(e){alert(e.message||"Не удалось сохранить чек.")}
}
function renderExpenses(){
  let d=get(KEY_EXPENSES).sort((a,b)=>b.date.localeCompare(a.date)),total=d.reduce((s,x)=>s+x.amount,0);
  $("expenseList").innerHTML=`<div class="stat" style="margin-top:14px"><div class="muted">Всего расходов</div><div class="total">€${total.toFixed(2)}</div></div>`+(d.length?d.map(x=>`<div class="entry"><div class="row"><b>${safe(x.date)}</b><span class="total">€${x.amount.toFixed(2)}</span></div><div><b>${safe(x.item)}</b> · ${safe(x.worker)}</div><div class="muted">${safe(x.category)}</div>${x.note?`<div>${safe(x.note)}</div>`:""}${role==="admin"||x.worker===current?`<button class="danger small" onclick="removeExpense(${x.id})">Удалить</button>`:""}</div>`).join(""):"<p class='muted'>Расходов пока нет.</p>");
}
function removeExpense(id){if(!confirm("Удалить расход?"))return;put(KEY_EXPENSES,get(KEY_EXPENSES).filter(x=>x.id!==id));renderExpenses()}

function addWorker(){
  let n=$("newWorker").value.trim(),p=$("newWorkerPassword").value;
  if(!n){alert("Введи имя.");return}
  if(p.length<4){alert("Пароль должен быть не короче 4 символов.");return}
  if(users.some(u=>u.name===n)){alert("Такой работник уже есть.");return}
  users.push({name:n,password:p});saveUsers();$("newWorker").value="";$("newWorkerPassword").value="";fillWorkers();renderUsers();alert("Работник добавлен.");
}
function renderUsers(){
  $("userList").innerHTML=users.map((u,i)=>`<div class="entry"><div class="row"><b>${safe(u.name)}</b><span class="badge">Пароль установлен</span></div>${i>=3?`<button class="danger small" onclick="removeUser(${i})">Удалить</button>`:""}</div>`).join("");
}
function removeUser(i){
  if(i<3){alert("Стас, Юра и Артур — основные пользователи тестовой версии.");return}
  if(!confirm("Удалить пользователя "+users[i].name+"?"))return;users.splice(i,1);saveUsers();fillWorkers();renderUsers();
}
fillWorkers();
</script>
</body>
</html>
